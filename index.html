<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Violation Set</title>  
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><link href="style.css" rel="stylesheet" type="text/css" />
     <link href="style.css" rel="stylesheet" type="text/css" />
    <script src="helper.js"></script>
    <script src="script.js"></script>    
   </head>
  <body onload="init()">
    <div id="banner" class="container center">
      <h1> Housing Maintenance Violations - Location map </h1>
    </div>

    <div class="filters">
      <h2>Single Filter</h2>
      <label for="borough">Borough:</label>
        <select id="borough">
        <option value="">All</option>
        <option value="Manhattan">Manhattan</option>
        <option value="Queens">Queens</option>
        <option value="Bronx">Bronx</option>
        <option value="Brooklyn">Brooklyn</option>
        <option value="Staten Island">Staten Island</option>
        </select>

        <h2>Multiple Filters</h2>
        <label for="violations"> Violation type: </label>
        <input type="violations" id="violations" placeholder="Enter">

        <label for="zip code"> Zip code: </label>
        <input type="zip code" id="zip code" placeholder="Enter">

        <label for="date">Date (YYYY-MM-DD):</label>
        <input type="date" id="date">

        <button id="applyFilters">Apply Filters</button>
    </div>

    <div id="output"></div>
    <div id="result"></div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
